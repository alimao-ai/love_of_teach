spring:
  datasource:
    url: jdbc:h2:mem:love_of_teach_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false

app:
  seed:
    enabled: false
  auth:
    enabled: false
    teacher-registration-code: TEST-REGISTER-CODE
    login-max-failures: 5
    login-block-minutes: 15
  upload-dir: ./target/test-uploads
