server:
  port: 8080

spring:
  application:
    name: love-of-teach-platform
  datasource:
    url: jdbc:h2:file:./data/love_of_teach;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

spring.jackson:
  default-property-inclusion: non_null

logging:
  level:
    org.hibernate.SQL: warn

app:
  auth:
    enabled: true
    token-ttl-hours: 24
  upload-dir: ./uploads
